- id: "axi_bram_ctrl_0"
  definition: "xilinx.com:ip:axi_bram_ctrl:4.1"
  configuration: 
  - name: PROTOCOL
    values: ["AXI4", "AXI4LITE"]

  - name: DATA_WIDTH
    enable: "PROTOCOL == 'AXI4'"
    values: [32, 64, 128, 256, 512, 1024] 

  # TODO: check auto/manual toggle (separate variable?)
  - name: SUPPORTS_NARROW_BURST
    enable: "PROTOCOL == 'AXI4'"
    values: [0,1]

  - name: READ_LATENCY
    values_eval: range(1, 129)

  - name: RD_CMD_OPTIMIZATION
    enable: "READ_LATENCY == 1"
    values: [0,1]
    
  # SINGLE_PORT_BRAM, 0 = dual port BRAM, 1 = single port BRAM
  - name: SINGLE_PORT_BRAM
    values: [0,1]
    
  - name: USE_ECC
    values: [0,1]

  # 0 = Hamming, 1 = HSIAO
  - name: ECC_TYPE
    enable: "USE_ECC"
    values: [0,1]

  - name: FAULT_INJECT
    enable: "USE_ECC"
    values: [0,1]

  - name: ECC_ONOFF_RESET_VALUE
    enable: "USE_ECC"
    values: [0,1]

  # bram add on
  - name: BLK_MEM
    value: true # Always enable bram add on

  
  ports:
  - name: S_AXI_CTRL 
    enable: USE_ECC
    protocol: "xilinx.com:interface:aximm_rtl:1.0"
    direction: Slave
    connections:
    - axi_bram_ctrl_0/S_AXI_CTRL
    addr_seg_name: "axi_bram_ctrl_0/S_AXI_CTRL/Reg"

  - name: S_AXI 
    protocol: "xilinx.com:interface:aximm_rtl:1.0"
    direction: Slave
    connections:
    - axi_bram_ctrl_0/S_AXI
    addr_seg_name: "axi_bram_ctrl_0/S_AXI/Mem0"

  - name: s_axi_aclk
    protocol: clk
    direction: I
    width: 1
    connections:
    - axi_bram_ctrl_0/s_axi_aclk

  - name: s_axi_aresetn
    protocol: reset
    direction: I
    width: 1
    connections:
    - axi_bram_ctrl_0/s_axi_aresetn

  
  - name: ecc_interrupt
    enable: USE_ECC
    protocol: irq
    direction: O
    width: 1
    connections:
    - axi_bram_ctrl_0/ecc_interrupt

  - name: ecc_ue
    enable: USE_ECC
    protocol: data
    direction: O
    width: 1
    connections:
    - axi_bram_ctrl_0/ecc_ue


### Block Memory Generator ###
- id: "blk_mem_gen_0"
  enable: BLK_MEM
  definition: "xilinx.com:ip:blk_mem_gen:8.4"
  configuration: 
  - name: use_bram_block
    values: ["BRAM_Controller", "Stand_Alone"]

  - name: Enable_32bit_Address
    enable: "use_bram_block == 'Stand_Alone'"
    values: [true, false]

  - name: Memory_Type
    values_eval: >
      (
        ["Single_Port_RAM", "Simple_Dual_Port_RAM", "True_Dual_Port_RAM", "Single_Port_ROM", "Dual_Port_ROM"] 
        if use_bram_block == "Stand_Alone" else ["Single_Port_RAM", "True_Dual_Port_RAM", "Single_Port_ROM", "Dual_Port_ROM"]
      )

  - name: Assume_Synchronous_Clk
    enable: "Memory_Type in ['Simple_Dual_Port_RAM', 'True_Dual_Port_RAM', 'Dual_Port_ROM']"
    values: [true, false]

  - name: ecctype
    values_eval: "['No_ECC', 'Soft_ECC', 'BuiltIn_ECC'] if Memory_Type == 'Simple_Dual_Port_RAM' else ['No_ECC']"

  - name: Use_Error_Injection_Pins
    values_eval: "[True, False] if ecctype in ['Soft_ECC', 'BuiltIn_ECC'] else [False]"

  - name: Error_Injection_Type
    enable: Use_Error_Injection_Pins
    values: ["Single_Bit_Error_Injection", "Double_Bit_Error_Injection", "Single_and_Double_Bit_Error_Injection"]

  - name: Use_Byte_Write_Enable
    values_eval:  >
      [True, False] if (Memory_Type in ["Single_Port_RAM", "True_Dual_Port_RAM"] or (Memory_Type == "Simple_Dual_Port_RAM" and ecctype == "No_ECC")) else [False]

  - name: Byte_Size
    enable: Use_Byte_Write_Enable
    values: [8, 9]

  - name: Algorithm
    values_eval: >
      ["Minimum_Area", "Low_Power", "Fixed_Primitives"] if ((use_bram_block == "Stand_Alone"
                                                            and Memory_Type in ["Single_Port_RAM", "True_Dual_Port_RAM", "Single_Port_ROM", "Dual_Port_ROM"])
                                                        or (Memory_Type == "Simple_Dual_Port_RAM" and ecctype == "No_ECC")) else ["Minimum_Area"]

  - name: Primitive
    enable: "Algorithm == 'Fixed_Primitives'"
    values: ["16kx1", "8kx2", "4kx4", "2kx9", "1kx18", "512x36", "256x72"]
  
  ### Port A ###
  - name: Write_Width_A
    enable: "use_bram_block == 'Stand_Alone'"
    values_eval: >
      range(1, 4609) if Enable_32bit_Address == False else [32,40,64,72,128,144,256,512,1024]

  - name: Read_Width_A
    enable: "use_bram_block == 'Stand_Alone' and Memory_Type in ['Single_Port_RAM', 'True_Dual_Port_RAM']"
    values_eval: "[Write_Width_A]"

  - name: Write_Depth_A
    enable: "use_bram_block == 'Stand_Alone'"
    values_eval: >
      range(2, 1048577) if Write_Width_A in range(1, 129) else 
      range(2, 524289) if Write_Width_A in range(129, 257) else
      range(2, 262145) if Write_Width_A in range(257, 513) else
      range(2, 131073) if Write_Width_A in range(513, 1025) else
      range(2, 65537) if Write_Width_A in range(1025, 2049) else 
      range(2, 32769) if Write_Width_A in range(2049, 4609) else range (2, 2)

  - name: Read_Depth_A
    enable: "use_bram_block == 'Stand_Alone' and Memory_Type in ['Single_Port_RAM', 'True_Dual_Port_RAM']"
    values_eval: "[Write_Depth_A]"

  - name: Operating_Mode_A
    enable: "use_bram_block == 'Stand_Alone' and Memory_Type in ['Single_Port_RAM', 'Simple_Dual_Port_RAM', 'True_Dual_Port_RAM']"
    values: ["READ_FIRST", "WRITE_FIRST", "NO_CHANGE"]
  
  - name: Enable_A
    enable: "use_bram_block == 'Stand_Alone'"
    values: ["Use_ENA_Pin", "Always_Enabled"]

  - name: Register_PortA_Output_of_Memory_Primitives
    values_eval: >
      [True, False] if (use_bram_block == "Stand_Alone"
                        and Memory_Type in ["Single_Port_RAM", "True_Dual_Port_RAM", "Single_Port_ROM", "Dual_Port_ROM"]) else [False]

  - name: Register_PortA_Output_of_Memory_Core
    enable: "use_bram_block == 'Stand_Alone' and Memory_Type in ['Single_Port_RAM', 'True_Dual_Port_RAM', 'Single_Port_ROM', 'Dual_Port_ROM']"
    values: [true, false]

  - name: Register_PortA_input_of_softecc
    enable: "ecctype == 'Soft_ECC'"
    values: [true, false]

  - name: Use_REGCEA_Pin
    enable: Register_PortA_Output_of_Memory_Primitives
    values: [true, false]

  - name: Use_RSTA_Pin
    values_eval: >
      [True, False] if (use_bram_block == "Stand_Alone"
                        and Memory_Type in ["Single_Port_RAM", "True_Dual_Port_RAM", "Single_Port_ROM", "Dual_Port_ROM"]) else [False]

  - name: Output_Reset_Value_A 
    enable: Use_RSTA_Pin
    values_eval: range(0x0, 0x100000000) # TODO: check this
    format: hex

  - name: Reset_Memory_Latch_A
    values_eval: "[True, False] if Use_RSTA_Pin else [False]"

  - name: Reset_Priority_A
    enable: "Use_RSTA_Pin == True and Reset_Memory_Latch_A == False"
    values: ["CE", "SR"]

    ### Port B ###
  - name: Write_Width_B
    enable: "use_bram_block == 'Stand_Alone' and Memory_Type in ['Simple_Dual_Port_RAM', 'True_Dual_Port_RAM', 'Dual_Port_ROM']"
    values_eval: "[Write_Width_A]"

  - name: Read_Width_B
    enable: "use_bram_block == 'Stand_Alone' and Memory_Type == 'True_Dual_Port_RAM'"
    values_eval: "[Write_Width_B]"

  - name: Operating_Mode_B
    enable: "use_bram_block == 'Stand_Alone' and Memory_Type == 'True_Dual_Port_RAM'"
    values: ["WRITE_FIRST", "READ_FIRST", "NO_CHANGE"]

  - name: Enable_B
    enable: "use_bram_block == 'Stand_Alone' and Memory_Type in ['Simple_Dual_Port_RAM', 'True_Dual_Port_RAM', 'Dual_Port_ROM']"
    values: ["Use_ENB_Pin", "Always_Enabled"]

  - name: Register_PortB_Output_of_Memory_Primitives
    values_eval: >
      [True, False] if (use_bram_block == 'Stand_Alone' and 
                        Memory_Type in ['Simple_Dual_Port_RAM', 'True_Dual_Port_RAM', 'Dual_Port_ROM']) else [False]

  - name: Register_PortB_Output_of_Memory_Core
    enable: "use_bram_block == 'Stand_Alone' and Memory_Type in ['Simple_Dual_Port_RAM', 'True_Dual_Port_RAM', 'Dual_Port_ROM']"
    values: [true, false]

  - name: Register_PortB_Output_of_Softecc
    enable: "use_bram_block == 'Stand_Alone' and Memory_Type == 'Simple_Dual_Port_RAM' and ecctype == 'Soft_ECC'"
    values: [true, false]

  - name: Use_REGCEB_Pin
    enable: Register_PortB_Output_of_Memory_Primitives
    values: [true, false]

  - name: Use_RSTB_Pin
    values_eval: >
      [True, False] if (use_bram_block == 'Stand_Alone' and 
                        Memory_Type in ['Simple_Dual_Port_RAM', 'True_Dual_Port_RAM', 'Dual_Port_ROM']) else [False]

  - name: Output_Reset_Value_B
    enable: Use_RSTB_Pin
    values_eval: range(0x0, 0x100000000) # TODO: check this
    format: hex

  - name: Reset_Memory_Latch_B
    values_eval: "[True, False] if Use_RSTB_Pin else [False]"

  - name: Reset_Priority_B
    enable: "Use_RSTB_Pin == True and Reset_Memory_Latch_B == False"
    values: ["CE", "SR"]

  internal_connections: 
  - from: axi_bram_ctrl_0/BRAM_PORTA
    to: blk_mem_gen_0/BRAM_PORTA
    is_interface: true
    enable: BLK_MEM

  - from: axi_bram_ctrl_0/BRAM_PORTB
    to: blk_mem_gen_0/BRAM_PORTB
    is_interface: true
    enable: "Memory_Type in ['True_Dual_Port_RAM', 'Simple_Dual_Port_RAM', 'Dual_Port_ROM']"